[package]
name = "sootmark-browser"
version = "0.6.0"
edition = "2021"
rust-version = "1.80"
description = "Browser artifacts for forensics: history and downloads (Chromium, Firefox, Safari, Internet Explorer WebCache) with deleted entries recovered, cookies, form history, extensions and their activity."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/browser"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "chrome", "firefox"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "browser"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }
ese = { package = "sootmark-ese", version = "0.1.0" }
plist = { package = "sootmark-plist", version = "0.1.0" }
sqlite = { package = "sootmark-sqlite", version = "0.2.0" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
